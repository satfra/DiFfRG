[tuning.m2A]
  tune = false

  # With zc_target > 0 the search accepts any convergent flow whose Zc(0) lands BELOW the target,
  # so there is no tolerance involved. rel_tol only governs the deep-scaling mode (zc_target = 0),
  # where there is no interval to land in and the fitted separatrix is converged to instead.
  zc_target = 0.01
  rel_tol   = 0.001

  # Cold bracket in the dimensionless u = m2A/Lambda^2; the initial condition is
  # ZA(p) = (p^2 + m2A)/p^2 at k = Lambda, so u is the natural search variable and this bracket
  # transfers across cutoff scales where an absolute one goes stale. These are hypotheses: the
  # search widens them geometrically if they do not straddle, so being wrong costs a few flows
  # rather than a failed run. Everything else the search needs is a named constant in tuning.hh,
  # together with the measurement it came from.
  u_lower = -3e-2
  u_upper = -1e-3

[tuning.STI]
  tune      = true
  tol       = 0.0001
  step_size = 0.01

  # Momentum at which the coupling avatars are compared (the second point is twice this), well
  # inside the perturbative window where the identity holds exactly.
  scale = 10

  # Search fidelity. Every objective evaluation nests a full m2A tune, so the inner flows are
  # shortened and coarsened during the search and restored for the final refinement. coarse_factor
  # multiplies m2A/rel_tol: the inner tune only has to RANK simplex points.
  flow_final_time   = 9
  quadrature_factor = 0.5
  coarse_factor     = 10

[physical]
  Lambda       = 200
  Nc           = 3
  m2A          = -71.98873562456
  alphaA4      = 0.1
  alphaA3      = 0.1
  alphaAcbc    = 0.1
  tilt_A4      = 0
  tilt_A3      = 0
  tilt_Acbc    = 0
  eta_iter_max = 20
  eta_tol      = 0.001

[integration]
  x_order            = 32
  cos1_order         = 8
  cos2_order         = 8
  phi_order          = 8
  x_extent_tolerance = 1e-4

[discretization]
  p_grid_min = 1e-4
  p_grid_max = 100
  # Cluster the 96 momentum points around the gluon dressing peak. p_grid_focus = 0 gives a plain
  # logarithmic grid; at 1.5 the cell width at 1 GeV is 0.018 decades instead of 0.063, and 42
  # instead of 15 points fall into [0.3, 3] GeV. The price is the deep IR and UV, where the
  # coarsest cell grows to 0.24 decades -- both are flat there.
  p_grid_center = 1.0
  p_grid_focus  = 1.5

[timestepping]
  final_time = 14
  output_dt  = 0.2

[timestepping.explicit]
  dt = 0.2

[output]
  verbosity = 1
  folder    = "./"
  name      = "output"
