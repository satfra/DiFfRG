# Tutorial 6 with the Kurganov-Tadmor assembler.

[tutorial]
  # cg (with parameter.toml) or kt
  assembler = "kt"
  # per_point, cpu or gpu
  backend = "cpu"

[physical]
Lambda = 0.65
N = 2
T = 0.05
# initial condition V'(rho) = m2 + lambda / 2 * rho
m2 = -0.1
lambda = 71.6

[integration]
x_order = 32
x_extent_tolerance = 1e-4
jacobian_quadrature_factor = 0.5

[discretization.grid]
x_grid = "0:1e-4:1.5e-2"
refine = 0

[timestepping]
final_time = 4
output_dt = 0.1

[timestepping.implicit]
dt = 1e-3
minimal_dt = 1e-4
maximal_dt = 0.1
abs_tol = 1e-13
rel_tol = 1e-7
max_steps = 5e6

[output]
vtk = false
hdf5 = true
verbosity = 1
folder = "./"
name = "output_KT"
